<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Nekudot — Add Nikud to Text</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fff;
            --fg: #1a1a1a;
            --border: #ccc;
            --accent: #2563eb;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #1e1e1e; --fg: #eee; --border: #444; }
        }
        body {
            margin: 0 auto;
            max-width: 720px;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.6 sans-serif;
        }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .subtitle { margin: 0 0 16px; font-size: 14px; opacity: .75; }
        textarea {
            width: 100%;
            min-height: 160px;
            box-sizing: border-box;
            padding: 12px;
            font: inherit;
            color: inherit;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
        }
        .row { display: flex; gap: 8px; margin: 12px 0; align-items: center; }
        button {
            font: inherit;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: default; }
        button.secondary { background: transparent; color: inherit; border: 1px solid var(--border); }
        #status { font-size: 14px; opacity: .75; }
    </style>
</head>
<body>
<h1>Add Nikud to Text (ניקוד)</h1>
<p class="subtitle">Paste Hebrew text below — useful in apps that can't be edited in place, like Google Docs or Word Online.</p>
<textarea id="input" dir="rtl" placeholder="Paste Hebrew text here..." autofocus></textarea>
<div class="row">
    <button id="run">Add Nikud (נַקֵּד)</button>
    <span id="status"></span>
</div>
<textarea id="output" dir="rtl" readonly placeholder="The text with nikud will appear here"></textarea>
<div class="row">
    <button id="copy" class="secondary" disabled>Copy</button>
</div>
<script type="module" src="paste.js"></script>
</body>
</html>
